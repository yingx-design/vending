<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Vending Machine</title>

<style>
* {
  box-sizing: border-box;
}

html,
body {
  margin: 0;
  width: 100%;
  min-height: 100%;
  font-family: Arial, Helvetica, sans-serif;
}

body {
  background: #efefef;
  overflow-x: hidden;
}

/* =========================
   PAGE
========================= */

.stage {
  width: 100vw;
  min-height: 100vh;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 10px;
}

/* =========================
   MACHINE
========================= */

.machine {
  position: relative;

  width: min(94vw, 760px);
}

.machine-bg {
  display: block;

  width: 100%;
  height: auto;

  pointer-events: none;
  user-select: none;
}

/* =========================
   PRODUCTS
   5 columns × 4 rows
========================= */

.products {
  position: absolute;

  /*
    这一块覆盖机器左边商品展示窗
  */
  left: 6.4%;
  top: 15.3%;

  width: 67.5%;
  height: 67%;

  display: grid;

  grid-template-columns:
    repeat(5, 1fr);

  grid-template-rows:
    repeat(4, 1fr);

  column-gap: 0;
  row-gap: 1.5%;

  z-index: 4;
}

/* =========================
   EACH PRODUCT
========================= */

.product {
  position: relative;

  display: flex;
  justify-content: center;
  align-items: center;

  cursor: pointer;

  transition:
    transform .18s ease,
    opacity .25s ease;
}

.product:hover {
  transform: scale(1.10);
}

/* 商品本身 */

.product img {
  width: 105%;
  height: 105%;

  max-width: none;

  object-fit: contain;

  pointer-events: none;
  user-select: none;

  filter:
    drop-shadow(
      0 7px 5px
      rgba(0,0,0,.28)
    );
}

/* 第一排稍微往上 */

.product:nth-child(-n+5) {
  transform: translateY(-2%);
}

.product:nth-child(-n+5):hover {
  transform:
    translateY(-2%)
    scale(1.10);
}

/* 第二排 */

.product:nth-child(n+6):nth-child(-n+10) {
  transform: translateY(-1%);
}

.product:nth-child(n+6):nth-child(-n+10):hover {
  transform:
    translateY(-1%)
    scale(1.10);
}

/* =========================
   DISPLAY
========================= */

.display {
  position: absolute;

  right: 5.5%;
  top: 27.8%;

  width: 16.5%;

  padding: 6px 2px;

  text-align: center;

  background: #111;
  color: white;

  font-family: monospace;

  font-size:
    clamp(8px, 1.2vw, 13px);

  z-index: 10;

  pointer-events: none;
}

.display.ready {
  color: #62ff70;
}

/* =========================
   COIN SLOT
========================= */

.coin-slot {
  position: absolute;

  right: 8%;
  top: 31.5%;

  width: 10%;
  height: 11%;

  z-index: 9;
}

/* =========================
   COIN
========================= */

.coin {
  position: fixed;

  left: 35px;
  bottom: 35px;

  width: 76px;
  height: 76px;

  object-fit: contain;

  cursor: grab;

  z-index: 100;

  user-select: none;

  filter:
    drop-shadow(
      0 8px 7px
      rgba(0,0,0,.30)
    );

  transition:
    transform .15s ease;
}

.coin:hover {
  transform: scale(1.08);
}

.coin.dragging {
  cursor: grabbing;

  transform: scale(1.13);
}

/* =========================
   FALLING PRODUCT
========================= */

.falling-product {
  position: fixed;

  width: 115px;
  height: 115px;

  object-fit: contain;

  z-index: 50;

  pointer-events: none;

  filter:
    drop-shadow(
      0 9px 7px
      rgba(0,0,0,.30)
    );

  transition:
    left .85s
      cubic-bezier(.25,.7,.3,1),

    top .85s
      cubic-bezier(.5,0,.85,1),

    transform .85s ease;
}

/* =========================
   INSTRUCTION
========================= */

.instructions {
  position: fixed;

  top: 28px;
  left: 28px;

  z-index: 100;

  font-size: 12px;

  letter-spacing: .1em;

  color: #111;

  pointer-events: none;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

  .stage {
    padding: 5px;
  }

  .coin {
    width: 55px;
    height: 55px;

    left: 15px;
    bottom: 15px;
  }

  .instructions {
    top: 12px;
    left: 12px;

    font-size: 8px;
  }
}
</style>
</head>


<body>

<div class="instructions">
  DRAG THE COIN → SELECT SOMETHING
</div>


<div class="stage">

  <div
    class="machine"
    id="machine"
  >

    <!-- MACHINE BACKGROUND -->

    <img
      src="vending-machine.png"
      class="machine-bg"
      alt="Vending Machine"
    >


    <!-- PRODUCTS -->

    <div class="products">


      <!-- ===== ROW A ===== -->


      <!-- A1 -->

      <div
        class="product"
        data-product="groundcycle.png"
      >
        <img
          src="groundcycle.png"
          alt=""
        >
      </div>


      <!-- A2 -->

      <div
        class="product"
        data-product="social-cloud.png"
      >
        <img
          src="social-cloud.png"
          alt=""
        >
      </div>


      <!-- A3 -->

      <div
        class="product"
        data-product="city-walk.png"
      >
        <img
          src="city-walk.png"
          alt=""
        >
      </div>


      <!-- A4 -->

      <div
        class="product"
        data-product="before-i-speak.png"
      >
        <img
          src="before-i-speak.png"
          alt=""
        >
      </div>


      <!-- A5 -->

      <div
        class="product"
        data-product="perfume.png"
      >
        <img
          src="perfume.png"
          alt=""
        >
      </div>



      <!-- ===== ROW B ===== -->


      <!-- B1 -->

      <div
        class="product"
        data-product="body-fonts.png"
      >
        <img
          src="body-fonts.png"
          alt=""
        >
      </div>


      <!-- B2 -->

      <div
        class="product"
        data-product="in-between.png"
      >
        <img
          src="in-between.png"
          alt=""
        >
      </div>


      <!-- B3 -->

      <div
        class="product"
        data-product="dad-healer.png"
      >
        <img
          src="dad-healer.png"
          alt=""
        >
      </div>


      <!-- B4 -->

      <div
        class="product"
        data-product="quiet-town.png"
      >
        <img
          src="quiet-town.png"
          alt=""
        >
      </div>


      <!-- B5 -->

      <div
        class="product"
        data-product="hypertext.png"
      >
        <img
          src="hypertext.png"
          alt=""
        >
      </div>


    </div>


    <!-- DISPLAY -->

    <div
      class="display"
      id="display"
    >
      INSERT COIN
    </div>


    <!-- INVISIBLE COIN TARGET -->

    <div
      class="coin-slot"
      id="coinSlot"
    ></div>

  </div>

</div>


<!-- COIN -->

<img
  src="coin.png"
  class="coin"
  id="coin"
  alt="Coin"
  draggable="false"
>


<script>

/* =========================
   ELEMENTS
========================= */

const coin =
  document.getElementById("coin");

const coinSlot =
  document.getElementById("coinSlot");

const display =
  document.getElementById("display");

const machine =
  document.getElementById("machine");

const products =
  document.querySelectorAll(
    ".product"
  );


let dragging = false;
let paid = false;

let offsetX = 0;
let offsetY = 0;


/* =========================
   COIN DRAG START
========================= */

coin.addEventListener(
  "mousedown",
  function(e) {

    dragging = true;

    coin.classList.add(
      "dragging"
    );

    const rect =
      coin.getBoundingClientRect();

    offsetX =
      e.clientX -
      rect.left;

    offsetY =
      e.clientY -
      rect.top;

    coin.style.bottom =
      "auto";

    coin.style.transition =
      "none";
  }
);


/* =========================
   COIN MOVE
========================= */

document.addEventListener(
  "mousemove",
  function(e) {

    if (!dragging) {
      return;
    }

    coin.style.left =
      (
        e.clientX -
        offsetX
      ) + "px";

    coin.style.top =
      (
        e.clientY -
        offsetY
      ) + "px";
  }
);


/* =========================
   COIN RELEASE
========================= */

document.addEventListener(
  "mouseup",
  function() {

    if (!dragging) {
      return;
    }

    dragging = false;

    coin.classList.remove(
      "dragging"
    );

    checkCoin();
  }
);


/* =========================
   CHECK COIN
========================= */

function checkCoin() {

  const coinRect =
    coin.getBoundingClientRect();

  const slotRect =
    coinSlot.getBoundingClientRect();


  const x =
    coinRect.left +
    coinRect.width / 2;

  const y =
    coinRect.top +
    coinRect.height / 2;


  const inside =

    x > slotRect.left &&

    x < slotRect.right &&

    y > slotRect.top &&

    y < slotRect.bottom;


  if (inside) {

    paid = true;

    display.textContent =
      "$1.00 SELECT";

    display.classList.add(
      "ready"
    );


    coin.style.transition =
      "all .30s ease";


    coin.style.left =
      (
        slotRect.left +
        slotRect.width / 2 -
        coinRect.width / 2
      ) + "px";


    coin.style.top =
      (
        slotRect.top +
        slotRect.height / 2 -
        coinRect.height / 2
      ) + "px";


    coin.style.transform =
      "scale(.05) rotate(180deg)";


    coin.style.opacity =
      "0";

  }

  else {

    resetCoin();

  }
}


/* =========================
   RESET COIN
========================= */

function resetCoin() {

  coin.style.transition =
    "all .35s ease";

  coin.style.transform =
    "";

  coin.style.opacity =
    "1";

  coin.style.left =
    "35px";

  coin.style.top =
    "auto";

  coin.style.bottom =
    "35px";
}


/* =========================
   PRODUCT CLICK
========================= */

products.forEach(
  function(product) {

    product.addEventListener(
      "click",
      function() {

        if (!paid) {

          display.textContent =
            "INSERT COIN";


          display.animate(
            [
              {
                transform:
                  "translateX(0)"
              },

              {
                transform:
                  "translateX(-5px)"
              },

              {
                transform:
                  "translateX(5px)"
              },

              {
                transform:
                  "translateX(0)"
              }
            ],

            {
              duration: 280
            }
          );

          return;
        }


        dispenseProduct(
          product
        );
      }
    );
  }
);


/* =========================
   DISPENSE PRODUCT
========================= */

function dispenseProduct(
  product
) {

  const image =
    product.dataset.product;


  const productRect =
    product.getBoundingClientRect();


  const machineRect =
    machine.getBoundingClientRect();


  /* 创建掉落商品 */

  const falling =
    document.createElement(
      "img"
    );


  falling.src =
    image;


  falling.className =
    "falling-product";


  falling.style.left =
    (
      productRect.left +
      productRect.width / 2 -
      57
    ) + "px";


  falling.style.top =
    (
      productRect.top +
      productRect.height / 2 -
      57
    ) + "px";


  document.body.appendChild(
    falling
  );


  /* 原商品消失 */

  product.style.opacity =
    "0";

  product.style.pointerEvents =
    "none";


  /* =========================
     DROP
  ========================= */


  requestAnimationFrame(
    function() {

      requestAnimationFrame(
        function() {


          /*
            目标：
            vending machine
            底部取货口
          */


          falling.style.left =
            (
              machineRect.left +
              machineRect.width *
              0.38
            ) + "px";


          falling.style.top =
            (
              machineRect.top +
              machineRect.height *
              0.86
            ) + "px";


          falling.style.transform =
            "rotate(30deg) scale(.85)";

        }
      );
    }
  );


  display.textContent =
    "THANK YOU";


  display.classList.remove(
    "ready"
  );


  paid = false;


  /* =========================
     RESET
  ========================= */


  setTimeout(
    function() {

      resetCoin();

      display.textContent =
        "INSERT COIN";

    },

    1400
  );
}

</script>

</body>
</html>
